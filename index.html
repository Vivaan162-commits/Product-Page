<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details Card</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="product-card">

    <div class="product-image">
      <h2>NIKE</h2>
      <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=800&q=80"
        alt="Red running shoe">
    </div>

    <div class="product-info">

      <div class="share">
        <span>↗</span>
      </div>

      <div class="title">
        <h1>Nike Zoom KD 12</h1>
        <span class="new">NEW</span>
      </div>

      <p class="subtitle">Men's Running Shoes</p>

      <hr>

      <div class="section">
        <h3>PRODUCT INFO</h3>
        <p>
          Elevate your style with our stylish and comfortable shoes, designed for both everyday wear and athletic
          performance.
        </p>
      </div>

      <hr>

      <div class="section">
        <h3>COLOR</h3>

        <div class="colors">
          <span class="color blue"></span>
          <span class="color red"></span>
          <span class="color green"></span>
          <span class="color orange"></span>
          <span class="color black"></span>
        </div>
      </div>

      <hr>

      <div class="section">
        <h3>SIZE</h3>

        <div class="sizes">
          <span>7</span>
          <span>8</span>
          <span>9</span>
          <span>10</span>
          <span>11</span>
        </div>
      </div>

      <hr>

      <div class="bottom">
        <button class="cart">🛒 ADD TO CART</button>
        <h2 class="price">$189.99</h2>
      </div>

    </div>

</body>

</html>
